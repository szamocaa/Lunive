# Builds the desktop versions of Lunive from the index.html on main and puts them on a GitHub Release:
# a Windows installer (.exe) and a Mac disk image (.dmg) that runs on both Apple Silicon and Intel Macs.
name: Desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

concurrency:
  group: desktop-app
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'desktop/dist/*.exe', if-no-files-found: error }

  mac:
    runs-on: macos-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm run dist:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Sign (ad hoc) and make the disk image
        run: |
          VER=$(node -p "require('./package.json').version")
          APP="dist/mac-universal/Lunive.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p dmgroot && ditto "$APP" dmgroot/Lunive.app && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Lunive" -srcfolder dmgroot -ov -format UDZO "dist/Lunive-$VER-mac.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: 'desktop/dist/*.dmg', if-no-files-found: error }

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          VER=$(grep -o "LUNIVE_VER='[0-9.]*'" index.html | grep -o "[0-9][0-9.]*")
          TAG="v$VER"
          NOTES="Lunive $VER for your computer.

          - **Windows:** download \`Lunive-Setup-$VER.exe\` and run it. Windows may say it protected your PC (the app isn't code-signed): click **More info**, then **Run anyway**.
          - **Mac:** download \`Lunive-$VER-mac.dmg\`, open it and drag Lunive into Applications. The first time, macOS may say it can't verify the app: open **System Settings → Privacy & Security** and click **Open Anyway**.

          Your progress is saved on your computer. Log in with your Kyuchi ID to carry it between the website and the app."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Lunive $VER" --notes "$NOTES" --latest
          fi
